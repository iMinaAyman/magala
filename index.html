<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma32ol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffd400;--fg:#0a0a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-snap-type:y proximity;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);transition:background .35s}
body{background:var(--bg);color:var(--fg);font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-size:15px;max-width:520px;margin:0 auto;line-height:1.35;overflow-x:hidden;transition:background .35s,color .35s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
svg{display:block}
.fix{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:20;color:var(--fg);transition:color .35s}
header{top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;height:60px;padding:0 20px}
.logo{font-family:'Anton',Impact,sans-serif;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.r{display:flex;gap:16px;align-items:center;font-weight:600;font-size:14px}
.bagb{display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--fg);color:var(--bg);transition:.35s}
.dots{right:10px;left:auto;transform:none;top:50%;width:auto;display:flex;flex-direction:column;gap:9px;margin-top:-60px}
.dots button{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3;padding:0;transition:.25s}
.dots button.on{opacity:1;height:22px;border-radius:4px}
.scr{min-height:100svh;scroll-snap-align:start;padding:84px 20px 104px;display:flex;flex-direction:column;background:var(--b);color:var(--f)}
.big{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:min(25vw,130px);line-height:.86;letter-spacing:.005em;word-break:break-word}
.meta{margin-top:14px;font-weight:500;font-size:15px;display:flex;justify-content:space-between;opacity:.85}
.list{margin-top:auto}
.pr{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid currentColor}
.pr .t{flex:1;min-width:0}
.pr b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.pr small{font-size:13.5px;opacity:.7}
.pr .p{font-weight:600;white-space:nowrap}
.plus{width:42px;height:42px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:22px;font-weight:300;line-height:1;flex:none}
.plus.on{background:var(--f);color:var(--b)}
.intro h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:min(20vw,104px);line-height:.9;margin-top:16px}
.intro p{margin-top:18px;font-size:17px;font-weight:500;max-width:22ch}
.cta{display:flex;gap:8px;margin-top:auto;padding-top:24px}
.btn{height:52px;padding:0 26px;border-radius:26px;font-weight:700;font-size:15px}
.btn.k{background:var(--f);color:var(--b)}
.btn.o{border:2px solid currentColor}
.hint{margin-top:22px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.hint svg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.hint svg{animation:none}html{scroll-behavior:auto}}
.search{display:flex;align-items:center;gap:12px;height:56px;border-bottom:2px solid currentColor;margin-top:30px}
.search input{flex:1;min-width:0;border:0;background:none;font:500 18px 'Inter Tight',sans-serif;color:inherit;outline:0}
.search input::placeholder{color:inherit;opacity:.55}
.search button{font-weight:700;font-size:14px}
.rows{margin-top:30px}
.rows div{display:flex;justify-content:space-between;padding:17px 0;border-top:1px solid currentColor;font-weight:600;font-size:17px}
.rows span{font-weight:400;opacity:.65}
.code{margin-top:26px;border:2px dashed currentColor;border-radius:14px;padding:6px 6px 6px 18px;display:flex;justify-content:space-between;align-items:center}
.code b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.04em}
.code button{height:44px;padding:0 20px;border-radius:22px;background:var(--f);color:var(--b);font-weight:700;font-size:14px}
nav{bottom:0;display:flex;justify-content:space-around;padding:9px 8px calc(9px + env(safe-area-inset-bottom,0px));background:var(--bg);transition:background .35s,color .35s}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;min-width:64px;opacity:.6}
nav button[aria-current="page"]{opacity:1;font-weight:700}
</style>
</head>
<body>
<header class="fix"><div class="logo">Ma32ol</div><div class="r"><button>EN / ع</button><button class="bagb"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span id="count">2</span></button></div></header>
<div class="fix dots" id="dots" aria-label="Sections"></div>
<main id="main"></main>
<nav class="fix">
  <button aria-current="page"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4Z"/></svg>Home</button>
  <button><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M12 12 4 7.5M12 12l8-4.5M12 12v9"/></svg>Orders</button>
  <button><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Cart</button>
  <button><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20S4 15 4 9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15 12 20 12 20Z"/></svg>Favorites</button>
</nav>

<script>
var dark=matchMedia('(prefers-color-scheme:dark)').matches;
var Y='#ffd400',K='#0a0a0a',B='#f2efe6';
var brands=[
 {n:'Nike',b:K,f:Y,i:[['Dri-FIT Training Tee',850],['Tech Fleece Hoodie',2400]]},
 {n:'adidas',b:B,f:K,i:[['Essentials Hoodie',1950],['Trefoil Tee',790]]},
 {n:'PUMA',b:'#e0b400',f:K,i:[['Logo Heavy Tee',720],['Zip Fleece Hoodie',2100]]},
 {n:'ZARA',b:'#2a2410',f:B,i:[['Linen Camp Shirt',1250],['Oversized Poplin Shirt',1450]]},
 {n:'H&M',b:'#fff0a3',f:K,i:[['Crew Sweatshirt',980],['Basic Cotton Tee',390]]},
 {n:"Levi's",b:'#d9cfa6',f:K,i:[['Relaxed Sweatshirt',1700],['Western Shirt',1890]]}];
var secs=[{b:Y,f:K,id:'intro'}].concat(brands.map(function(x){return {b:x.b,f:x.f,id:x.n}})).concat([{b:dark?K:B,f:dark?B:K,id:'info'}]);
var h='';
h+='<section class="scr intro" style="--b:'+Y+';--f:'+K+'"><div style="font-weight:600">New season · 2026</div><h1>Fashion from the brands you love.</h1><p>One marketplace. Many brands. Delivered to your door.</p><div class="cta"><button class="btn k" onclick="go(1)">Explore brands</button><button class="btn o" onclick="go(7)">Shop deals</button></div><div class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg>Scroll to browse brands</div></section>';
brands.forEach(function(x){
 h+='<section class="scr" style="--b:'+x.b+';--f:'+x.f+'"><div class="big">'+x.n+'</div><div class="meta"><span>New season 2026</span><span>'+x.i.length+' new</span></div><div class="list">'+x.i.map(function(p){return '<div class="pr"><div class="t"><b>'+p[0]+'</b><small>'+x.n+'</small></div><div class="p">EGP '+p[1].toLocaleString('en-US')+'</div><button class="plus" aria-label="Add to bag">+</button></div>'}).join('')+'</div></section>';
});
var s=secs[7];
h+='<section class="scr" style="--b:'+s.b+';--f:'+s.f+'"><div class="big" style="font-size:min(17vw,88px)">Find your fit.</div><form class="search" onsubmit="return false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search for a brand or product" aria-label="Search"><button>Search</button></form><div class="rows"><div>Fast delivery <span>To your door</span></div><div>Easy returns <span>Hassle-free</span></div></div><div class="list"><div class="code"><b>WELCOME10</b><button id="copy">Copy · 10% off</button></div></div></section>';
document.getElementById('main').innerHTML=h;
var dots=document.getElementById('dots');
dots.innerHTML=secs.map(function(_,i){return '<button aria-label="Section '+(i+1)+'" data-i="'+i+'"></button>'}).join('');
var els=[].slice.call(document.querySelectorAll('.scr'));
function go(i){els[i].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
dots.onclick=function(e){var b=e.target.closest('button');if(b)go(+b.dataset.i)};
var root=document.documentElement;
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var i=els.indexOf(e.target),c=secs[i];root.style.setProperty('--bg',c.b);root.style.setProperty('--fg',c.f);[].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===i)})}})},{threshold:.55});
els.forEach(function(e){io.observe(e)});
document.getElementById('main').addEventListener('click',function(e){var a=e.target.closest('.plus');if(!a||a.classList.contains('on'))return;a.classList.add('on');a.textContent='✓';document.getElementById('count').textContent=+document.getElementById('count').textContent+1});
document.getElementById('copy').onclick=function(){var b=this;try{navigator.clipboard.writeText('WELCOME10')}catch(e){}b.textContent='Copied';setTimeout(function(){b.textContent='Copy · 10% off'},1800)};
</script>
</body>
</html>
